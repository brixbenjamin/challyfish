include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_use_of_visible_for_testing_member: error
  exclude:
    - lib/l10n/app_localizations.dart
    - lib/l10n/app_localizations_*.dart

linter:
  rules:
    - prefer_final_locals
    - avoid_dynamic_calls
    - unawaited_futures
