name: CI
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: supabase start
      - run: supabase test db
      # NOTE: integration_test needs a device target. A headless Linux runner
      # has none, so these steps do not currently execute anywhere — verified
      # locally on an iOS simulator instead (plan 4 Task 16). Giving CI a target
      # means enabling a desktop platform or booting an Android emulator, which
      # is a decision beyond plan 4's scope; leaving the steps here, honest and
      # named, beats deleting the only record that they exist.
      - name: Two-device integration test
        run: |
          supabase db reset
          cd app
          flutter pub get
          flutter test integration_test/two_device_test.dart \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"

      - name: Money path integration test
        run: |
          supabase db reset
          cd app
          flutter test integration_test/money_path_test.dart \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)" \
            --dart-define=SUPABASE_SERVICE_ROLE_KEY="$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        # From each function's own directory: deno.json carries the import map,
        # and deno resolves its config from the working directory.
        run: |
          (cd supabase/functions/delete-account && deno check index.ts)
          (cd supabase/functions/revenuecat-webhook && deno check index.ts)

      - name: Test the webhook mapping
        run: deno test supabase/functions/revenuecat-webhook/mapping_test.ts
