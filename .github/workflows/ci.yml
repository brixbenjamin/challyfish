name: CI
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: supabase start
      - run: supabase test db
      - name: Two-device integration test
        run: |
          supabase db reset
          cd app
          flutter pub get
          flutter test integration_test/two_device_test.dart \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        # From the function's own directory: deno.json carries the import map,
        # and deno resolves its config from the working directory.
        working-directory: supabase/functions/delete-account
        run: deno check index.ts
